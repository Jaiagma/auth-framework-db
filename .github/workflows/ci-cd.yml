name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "9.0.x"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1 – Unit tests
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: authuser
          POSTGRES_PASSWORD: authpassword
          POSTGRES_DB: authdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authuser -d authdb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore auth-framework-api/AuthFramework.sln

      - name: Build
        run: dotnet build auth-framework-api/AuthFramework.sln \
          --no-restore --configuration Release

      - name: Apply database schema
        env:
          PGPASSWORD: authpassword
        run: |
          for script in extensions.sql enums.sql schema.sql functions.sql \
                        triggers.sql indexes.sql rls_policies.sql seed_data.sql; do
            echo "Applying $script"
            psql -h localhost -U authuser -d authdb_test -f "$script" || true
          done

      - name: Run tests
        env:
          ConnectionStrings__DefaultConnection: >-
            Host=localhost;Port=5432;Database=authdb_test;
            Username=authuser;Password=authpassword
          ASPNETCORE_ENVIRONMENT: Test
          Jwt__Algorithm: HS256
          Jwt__SecretKey: test-secret-key-minimum-32-chars-here
          Encryption__MasterKeyBase64: dGVzdC1rZXktMzItYnl0ZXMtZm9yLXRlc3Rpbmch
        run: |
          dotnet test auth-framework-api/ \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./test-results \
            --collect:"XPlat Code Coverage"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./test-results/
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./test-results/**/coverage.cobertura.xml
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Job 2 – Code format lint
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore auth-framework-api/AuthFramework.sln

      - name: Check formatting
        run: |
          dotnet format auth-framework-api/AuthFramework.sln \
            --verify-no-changes \
            --verbosity diagnostic

  # ─────────────────────────────────────────────────────────────────
  # Job 3 – Security scan
  # ─────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore auth-framework-api/AuthFramework.sln

      - name: Check for vulnerable packages
        run: |
          dotnet list auth-framework-api/AuthFramework.sln \
            package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Vulnerable NuGet packages detected. See vuln-report.txt."
            exit 1
          fi

      - name: Upload vulnerability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulnerability-report
          path: vuln-report.txt
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Job 4 – Build and push Docker image (main branch only)
  # ─────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [test, lint, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=true
            type=raw,value=${{ github.run_number }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./auth-framework-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DOTNET_VERSION=${{ env.DOTNET_VERSION }}

  # ─────────────────────────────────────────────────────────────────
  # Job 5 – Deploy to staging (develop branch only)
  # ─────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, lint, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v5
        with:
          context: ./auth-framework-api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to staging environment
        # Replace with your actual deployment mechanism
        # (kubectl, helm, fly.io deploy, AWS ECS update-service, etc.)
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging to staging..."
          # kubectl set image deployment/auth-api auth-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          # helm upgrade auth-framework ./helm --set image.tag=staging --namespace staging
          echo "Deployment to staging complete."

      - name: Run smoke tests against staging
        run: |
          echo "Running smoke tests..."
          # curl -f https://auth-staging.example.com/health
          echo "Smoke tests passed."

      - name: Notify on success
        if: success()
        run: |
          echo "::notice::Staging deployment succeeded for commit ${{ github.sha }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Staging deployment FAILED for commit ${{ github.sha }}"
